apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: app-container
        image: gopiborra227/my-python-app:latest
        ports:
        - containerPort: 5000
        - containerPort: 8000
        # --- ADD THIS SECTION BELOW ---
        resources:
          requests:
            memory: "64Mi"   # Minimum memory needed
            cpu: "100m"     # Minimum CPU (100 millicores)
          limits:
            memory: "128Mi"  # Maximum memory allowed
            cpu: "500m"     # Maximum CPU allowed
        # ------------------------------